name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      # The project targets toolset v145 (VS 2026); fall back to v143 when the
      # runner image only has VS 2022.
      - name: Build
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          $toolset = if ([version]$vs -ge [version]'18.0') { 'v145' } else { 'v143' }
          msbuild ClipTxt.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=$toolset

      # The solution only builds the tests; run them here so a failing check fails the job.
      - name: Test
        shell: pwsh
        run: ./${{ matrix.platform }}/Release/ClipTxtTests.exe

      # Win32 builds to Release/, x64 to x64/Release/; give each a platform-specific name.
      - name: Stage
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.platform }}' -eq 'x64') { 'x64/Release/ClipTxt.exe' } else { 'Release/ClipTxt.exe' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/ClipTxt-${{ matrix.platform }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ClipTxt-${{ matrix.platform }}
          path: dist/ClipTxt-${{ matrix.platform }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
